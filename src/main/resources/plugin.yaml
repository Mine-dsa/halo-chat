# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: halo-chat
spec:
  enabled: true
  requires: ">=2.27.0"
  author:
    name: Halo Chat
    website: https://www.halo.run
  logo: logo.svg
  homepage: https://www.halo.run
  displayName: "聊天"
  description: "为 Halo 提供 QQ / 微信风格的站内聊天：公共频道、群组、话题、游客昵称发言、文件传输与完整的后台聊天管理。"
  settingName: halo-chat-settings
  configMapName: halo-chat-configmap
  license:
    - name: "GPL-3.0"
      url: "https://www.gnu.org/licenses/gpl-3.0.html"
