apiVersion: plugin.halo.run/v1alpha1
kind: ExtensionDefinition
metadata:
  name: halo-chat-channel-comment-subject
spec:
  className: run.halo.chat.comment.ChatChannelCommentSubject
  extensionPointName: comment-subject
